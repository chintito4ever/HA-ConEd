---
name: Con Edison (multi-account)
version: "1.4.3"
slug: coned_scraper
description: Con Edison integration for Home Assistant — bills, payments and balance for every account on your login
url: https://github.com/chintito4ever/HA-ConEd
ingress: true
ingress_port: 8000
panel_icon: mdi:flash
panel_admin: false
init: false
homeassistant: 2023.3.0
homeassistant_api: true
arch:
  - aarch64
  - amd64
map:
  - addon_config:rw
  - homeassistant_config:rw
  - all_addon_configs:ro
ports:
  5555/tcp: null
ports_description:
  5555/tcp: "Prisma Studio (Database UI, no password; off unless enabled)"
options:
  log_level: info
  prisma_studio: false
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  prisma_studio: bool
